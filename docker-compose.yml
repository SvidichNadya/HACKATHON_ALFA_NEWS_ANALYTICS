services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa_news}
      POSTGRES_USER: ${POSTGRES_USER:-alfa_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    # PostgreSQL is intentionally internal-only. Django reaches it via db:5432
    # on the Compose network, so a host port mapping is not required.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfa_news} -d ${POSTGRES_DB:-alfa_news}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  web:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
