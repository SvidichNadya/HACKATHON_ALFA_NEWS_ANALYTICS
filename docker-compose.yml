services:
  radar:
    build: .
    image: alfa-business-radar:1.0
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      RADAR_COOKIE_SECURE: "0"
    volumes:
      - radar-var:/app/var
      - ./data/bank_analytics:/app/data/bank_analytics:ro
    restart: unless-stopped
volumes:
  radar-var:
